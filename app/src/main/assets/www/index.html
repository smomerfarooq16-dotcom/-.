<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iman o Taqwa</title>
<link href="./fonts/fonts.css" rel="stylesheet">
<style>
@property --p{syntax:'<number>';inherits:true;initial-value:0}
:root{--page:#EDE6D0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0A1511}}
:root[data-theme="dark"]{--page:#0A1511}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--page);display:flex;align-items:center;justify-content:center;font-family:Poppins,system-ui,sans-serif}
.frame{--uf:"Gulzar","Noto Nastaliq Urdu",serif;--ulh:1.75;--fs:1.15;--bg:#FFF8E7;--head:#0B3D2E;--card:#fff;--tx:#1A1A1A;--sub:#6B6B5E;--psub:#6B6B5E;--gold:#C9A227;--g1:#C9A227;--g2:#0B3D2E;--track:#EFE6C8;--ctrack:#EFE6C8;--btn:#0B3D2E;--btntxt:#fff;--bb:transparent;--pill:#7A5C00;--ok:#2E7D32;--okt:#fff;--sh:rgba(11,61,46,.08);--plaque:#0B3D2E;
position:relative;width:min(100vw,420px);height:min(100dvh,860px);background:var(--bg);overflow:hidden;color:var(--tx);font-size:calc(16px*var(--fs));display:flex;flex-direction:column;transition:background .3s ease-out}
@media(min-width:440px){.frame{border-radius:28px;border:1px solid rgba(201,162,39,.4)}}
.frame[data-t=green]{--bg:#0B3D2E;--head:#FFF8E7;--card:#FFF8E7;--psub:#CDD8CF;--gold:#E2BC4A;--g1:#E2BC4A;--g2:#66BB6A;--track:#1F5A47;--btn:#0B3D2E;--btntxt:#FFF8E7;--bb:#E2BC4A}
.frame[data-t=night]{--bg:#0F211B;--head:#F3E9C9;--card:#173329;--tx:#F3E9C9;--sub:#A9B8AE;--psub:#A9B8AE;--gold:#E2BC4A;--g1:#E2BC4A;--g2:#66BB6A;--track:#254A3C;--ctrack:#254A3C;--btn:#E2BC4A;--btntxt:#0B3D2E;--pill:#E8C766;--ok:#66BB6A;--okt:#0B3D2E;--sh:rgba(0,0,0,.25);--plaque:#173329}
.frame[dir=rtl]{font-feature-settings:"calt","liga","kern";font-variant-ligatures:common-ligatures contextual;letter-spacing:0;word-spacing:.05em;font-family:var(--uf),Poppins,serif;line-height:var(--ulh,1.9);font-size:calc(20px*var(--fs))}
.star{position:absolute;top:-30px;width:130px;height:130px;opacity:.06;color:var(--gold);pointer-events:none}.star.l{left:-30px}.star.r{right:-30px}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;transition:opacity .5s ease-out}
.hide{opacity:0;pointer-events:none}
#main{flex:1;overflow-y:auto;padding:20px 20px 12px;animation:pg .28s ease-out}
@keyframes pg{from{opacity:0;transform:translateY(4%)}to{opacity:1;transform:none}}
h1{font-size:1.375em;font-weight:600;color:var(--head);margin:6px 0 2px;line-height:1.3}
.frame[dir=rtl] h1{line-height:var(--ulh,1.9)}
.sub{font-size:.875em;color:var(--psub);margin:0}

.wrap,.tw{position:relative;width:200px;height:200px;border-radius:50%}

.pct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Poppins,sans-serif}
.pct b{font-size:calc(46px*var(--fs));font-weight:700;color:var(--head);line-height:1.1}
.pct span{font-size:.75em;color:var(--psub);font-family:inherit}
.frame[dir=rtl] .pct span{font-family:var(--uf),serif}
.streak{position:absolute;top:0;inset-inline-end:0;display:flex;align-items:center;gap:6px;background:var(--plaque);color:#FFF8E7;border:1.5px solid var(--gold);border-radius:12px;padding:4px 10px;font-size:.8em}
.streak i{color:#E2BC4A;font-style:normal}
.card{background:var(--card);border-radius:20px;border:1px solid rgba(201,162,39,.4);box-shadow:0 6px 18px var(--sh);padding:12px 14px;margin-bottom:12px;color:var(--tx)}
.row{display:flex;align-items:center;gap:6px}
.cb{flex:none;width:46px;height:46px;display:grid;place-items:center;border:0;background:none;padding:0;cursor:pointer}
.cb span{width:30px;height:30px;border-radius:9px;border:2px solid var(--gold);display:grid;place-items:center;color:transparent;font:16px Poppins;transition:background .2s ease-out,border-color .2s ease-out}
.cb[aria-checked=true] span{background:var(--ok);border-color:var(--ok);color:var(--okt)}
.txt{flex:1;min-width:0;cursor:pointer}
.t{font-size:1.125em;font-weight:500;line-height:1.3;word-break:break-word}
.frame[dir=rtl] .t{line-height:var(--ulh,1.9)}
.s{font-size:.875em;color:var(--sub);line-height:1.3}
.frame[dir=rtl] .s{line-height:calc(var(--ulh,1.9) - .1)}
.chip{flex:none;border-radius:14px;padding:4px 12px;font-size:.75em;font-weight:600;white-space:nowrap}
.chip.d{background:#2E7D32;color:#fff}
.frame[data-t=night] .chip.d{background:#66BB6A;color:#0B3D2E}
.chip.p{background:rgba(232,199,102,.22);border:1px solid #E8C766;color:var(--pill)}
.bar{height:6px;border-radius:3px;background:var(--ctrack);margin-top:10px;overflow:hidden}
.bar div{height:100%;background:linear-gradient(90deg,var(--g1),var(--g2));border-radius:3px;transition:width .4s ease-out}
button{font-family:inherit;color:inherit}
.add{flex:none;width:48px;height:48px;border-radius:14px;border:1.5px solid var(--gold);background:transparent;color:var(--tx);font:600 22px Poppins;cursor:pointer}
.pb,.sb{width:100%;min-height:60px;border-radius:18px;font-size:1.125em;font-weight:600;cursor:pointer;margin-top:12px}
.pb{background:var(--btn);color:var(--btntxt);border:1.5px solid var(--bb)}
.sb{background:transparent;border:1.5px solid var(--gold);color:var(--head)}
.pc{min-height:48px;padding:0 16px;border-radius:14px;border:1.5px solid rgba(201,162,39,.7);background:transparent;color:var(--head);font-size:.875em;font-weight:600;cursor:pointer;white-space:nowrap}
.pc[aria-pressed=true]{background:var(--btn);color:var(--btntxt);border-color:var(--bb,transparent)}
.frame[data-t=cream] .pc[aria-pressed=true]{border-color:#0B3D2E}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.nav{flex:none;display:flex;gap:2px;margin:0 10px 14px;padding:5px;background:var(--card);border-radius:24px;border:1px solid rgba(201,162,39,.4);box-shadow:0 6px 18px var(--sh)}
.nav button{flex:1;min-width:0;min-height:56px;padding:4px 2px;border:0;border-radius:18px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.63em;color:var(--sub);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav button.on{background:rgba(201,162,39,.22);color:#0B3D2E;font-weight:600}
.frame[data-t=night] .nav button.on{color:#F3E9C9}
.nav svg{width:21px;height:21px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.in{width:100%;min-height:56px;border-radius:14px;border:1px solid rgba(201,162,39,.7);background:var(--card);color:var(--tx);padding:0 14px;font-size:1em;margin-top:6px}
label{display:block;font-size:.875em;color:var(--sub);margin-top:14px}
.ar{font-family:Amiri,serif;font-size:calc(32px*var(--fs));line-height:1.8;color:var(--gold);text-align:center}
.tw{width:240px;height:240px;margin:12px auto}
.tw .ring{inset:0}
.tap{position:absolute;inset:22px;border-radius:50%;background:var(--card);border:1px solid rgba(201,162,39,.4);box-shadow:0 6px 18px var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:var(--tx);transition:transform .2s ease-out}
.tap:active{transform:scale(.97)}
.tap b{font:700 calc(54px*var(--fs))/1.1 Poppins}

#bgl{position:absolute;inset:0;background-position:center;pointer-events:none}
#bgl[data-v="1"]::after{content:"";position:absolute;inset:0;background:var(--bg);opacity:var(--dim,.78)}
.frame[dir=rtl] h1,.frame[dir=rtl] h2{padding-top:.25em;text-align:start;unicode-bidi:plaintext}
.frame[dir=rtl] .sub,.frame[dir=rtl] .t,.frame[dir=rtl] .s{unicode-bidi:plaintext;text-align:start}
.frame[dir=rtl] .chip,.frame[dir=rtl] .pc,.frame[dir=rtl] .pb,.frame[dir=rtl] .sb,.frame[dir=rtl] .nav button{line-height:1.6}
.frame[dir=rtl] .in{text-align:start}
.mh{display:flex;align-items:center;justify-content:space-between;margin:12px 0}
.mh b{color:var(--head);font-weight:600}
.arrow{width:48px;height:48px;border-radius:14px;border:1.5px solid var(--gold);background:var(--card);color:var(--tx);font-size:18px;cursor:pointer}
.frame[dir=rtl] .arrow{transform:scaleX(-1)}
.lg{display:flex;gap:14px;font-size:.75em;color:var(--psub);margin-top:12px;flex-wrap:wrap}
.lg u{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:5px;text-decoration:none}
.scrim{position:absolute;inset:0;background:rgba(11,61,46,.35);display:flex;align-items:flex-end;transition:opacity .28s ease-out;z-index:5}
.sheet{width:100%;background:var(--bg);border-radius:28px 28px 0 0;padding:20px 20px 24px;max-height:90%;overflow:auto;animation:pg .28s ease-out}
.frame[data-t=cream] .sheet{background:#FDF6E3}
.sheet h1{margin-top:0}
/* splash/login */
.cen{align-items:center;justify-content:center;text-align:center;padding:0 24px}
.blk{display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateY(14px);animation:rise .9s ease-out forwards}
@keyframes rise{to{opacity:1;transform:none}}
.grad{background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
.logo{font-family:var(--uf),serif;font-size:56px;line-height:1.7;margin-top:12px}
.word{font-weight:700;font-size:26px;letter-spacing:1.6px;line-height:1.3}
.tag{font-family:var(--uf),serif;font-size:16px;line-height:1.9;color:var(--psub);margin-top:12px}
.dots{display:flex;gap:10px;margin-top:56px}
.dots i{width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,var(--g1),var(--g2));animation:pl 1.4s ease-out infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes pl{0%,100%{opacity:.3;transform:scale(.8)}40%{opacity:1;transform:scale(1.15)}}
.lw{width:100%;text-align:start}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
label.fl{display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-size:1.125em;color:var(--head);margin-top:12px}
.sr{width:100%;text-align:start;cursor:pointer;font-size:1em;display:flex;align-items:center;gap:8px}
.sr>span:last-child{font-size:1.4em;color:var(--gold)}
.frame[dir=rtl] .sr>span:last-child{transform:scaleX(-1)}
.msg{color:var(--gold);font-size:1.05em;margin:4px 0 0;font-family:var(--uf),Poppins,serif;line-height:1.9;unicode-bidi:plaintext;text-align:start}
.lg0{display:block;width:min(62vw,250px);height:auto;margin:0 auto;filter:drop-shadow(0 8px 18px rgba(0,0,0,.18))}
.crd{font-size:.75em;color:var(--psub);letter-spacing:.6px;margin-top:22px;text-align:center}
.ta{width:100%;min-height:320px;border-radius:16px;border:1px solid rgba(201,162,39,.7);background:var(--card);color:var(--tx);padding:14px;font-family:Poppins,var(--uf),sans-serif;font-size:1em;line-height:2;resize:vertical;margin-top:4px}
.dzt{white-space:pre-wrap;font-size:.95em;line-height:1.8;margin-top:6px;unicode-bidi:plaintext;text-align:start;word-break:break-word;max-height:14em;overflow:auto;color:var(--tx)}
.grid button{position:relative}
.grid button.dy::after{content:"";position:absolute;bottom:3px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 1px rgba(255,255,255,.6)}
.rg{width:100%;accent-color:var(--gold);min-height:36px;margin-top:6px}
.cp{padding:4px;height:56px;cursor:pointer}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.swb{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);cursor:pointer;padding:0}
.paper{background:#fff;color:#1A1A1A;border-radius:10px;padding:18px;border:1px solid rgba(201,162,39,.5);max-height:48vh;overflow:auto;font-size:.9em;margin-bottom:6px;text-align:start}
.paper h1{font-size:1.3em!important;color:#0B3D2E!important;text-align:center}
.paper h2{color:#0B3D2E!important;margin:0!important}
.paper p{margin:6px 0}
.fsd{position:absolute;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 14px calc(10px + env(safe-area-inset-bottom,0px))}
.fsd .ta{flex:1;min-height:0;resize:none;margin-top:8px}
.fsd .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.fsd .hd b{color:var(--head);font-weight:600;font-size:.95em}
.fsd .hd .pc{min-height:44px}
.opt{width:100%;text-align:start;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:1em}
.opt .t{display:block}
.ringov{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:auto}
.rbell{font-size:64px;animation:rng .5s ease-in-out infinite alternate}
@keyframes rng{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.gb{display:flex;align-items:center;justify-content:center;gap:10px}
.gb b{background:#fff;color:#4285F4;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font:700 16px Poppins}
.bged{position:absolute;inset:0;z-index:25;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
.bged-stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;user-select:none}
.bged-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.bged-dim{position:absolute;inset:0;background:var(--bg);pointer-events:none}
.bged-hud{position:absolute;inset:0;padding:16px 20px;pointer-events:none;overflow:hidden;opacity:.92}
.bged-ctl{flex:none;background:var(--card);border-top:1px solid rgba(201,162,39,.5);border-radius:22px 22px 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));max-height:46%;overflow-y:auto;box-shadow:0 -6px 20px rgba(0,0,0,.18)}
.bged-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.bged-row label{margin:0;min-width:84px;font-size:.78em}
.bged-row .rg{margin:0;flex:1;min-height:28px}
.permov{position:absolute;inset:0;z-index:24;background:var(--bg);overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(24px + env(safe-area-inset-bottom,0px))}
.ptick{flex:none;min-width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9em}
.ptick.ok{background:var(--ok);color:var(--okt)}
.ptick.no{border:1.5px solid var(--gold);color:var(--gold)}
.wk-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.wk-stat{background:var(--card);border-radius:16px;border:1px solid rgba(201,162,39,.4);box-shadow:0 4px 12px var(--sh);padding:10px 8px;text-align:center}
.wk-stat b{display:block;font:700 1.25em/1.2 Poppins,sans-serif;color:var(--head)}
.wk-stat span{display:block;font-size:.7em;color:var(--sub);margin-top:3px;line-height:1.3}
.wk-chart{width:100%;min-height:220px;margin-top:8px}
.wk-chart svg{display:block;width:100%;height:auto;overflow:visible}
.wk-dayrow{width:100%;text-align:start;background:none;border:0;border-top:1px solid rgba(201,162,39,.22);padding:10px 4px;display:flex;align-items:center;gap:10px;cursor:pointer;min-height:48px}
.wk-dayrow:first-child{border-top:0}
.wk-dayrow.sel{background:rgba(201,162,39,.12);border-radius:12px;padding:10px 8px}
.wk-mini{flex:1;height:8px;border-radius:4px;background:var(--ctrack);overflow:hidden}
.wk-mini>div{height:100%;border-radius:4px;transition:width .35s ease-out}
.wk-rc{width:100%;min-height:210px;margin-top:8px}
.wk-rc .recharts-wrapper{max-width:100%}
.wk-h2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:24px 0 12px}
.wk-h2 h2{margin:0}
.qpara{margin-top:10px;padding-top:8px;border-top:1px solid rgba(201,162,39,.25)}
.qpara label{margin:0 0 6px;font-size:.82em;color:var(--sub);display:block}
.qpara-row{display:flex;align-items:center;gap:10px}
.qpara-in{width:116px;flex:none;min-height:48px;margin-top:0;padding:0 12px;font-size:.95em;text-align:center}
.qpara-hint{flex:1;min-width:0;font-size:.82em;color:var(--head);font-weight:500;line-height:1.35}
.wk-ptag{display:inline-block;margin-inline-start:6px;padding:1px 7px;border-radius:10px;background:rgba(201,162,39,.18);border:1px solid rgba(201,162,39,.55);font-size:.75em;font-weight:600;color:var(--head);vertical-align:middle}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>

 <div id="sheet"></div>

 function drawEd(){
  if(!BGED)return;
  var ctx=cv.getContext('2d'),cw=cv.width,ch=cv.height;
  ctx.clearRect(0,0,cw,ch);
  ctx.save();
  ctx.filter='brightness('+BGED.br+'%) contrast('+BGED.ct+'%) saturate('+BGED.sat+'%)';
  var iw=(BGED.rot%180===0)?BGED.im.width:BGED.im.height;
  var ih=(BGED.rot%180===0)?BGED.im.height:BGED.im.width;
  var baseScale=Math.max(cw/iw,ch/ih);
  var sc=baseScale*BGED.zoom;
  ctx.translate(cw/2+BGED.ox,ch/2+BGED.oy);
  ctx.rotate(BGED.rot*Math.PI/180);
  ctx.scale(sc,sc);
  ctx.drawImage(BGED.im,-BGED.im.width/2,-BGED.im.height/2);
  ctx.restore();
  cv.style.filter=BGED.blr?'blur('+BGED.blr+'px)':'none';
  cv.style.transform=BGED.blr?'scale(1.1)':'none';
  var dm=$('bged-dim');if(dm)dm.style.opacity=BGED.dim/100;
 }
 BGED.draw=drawEd;
 drawEd();
 st.addEventListener('touchstart',function(ev){
  if(!BGED)return;
  if(ev.touches.length===1){BGED.drag={x:ev.touches[0].clientX,y:ev.touches[0].clientY,ox:BGED.ox,oy:BGED.oy};BGED.pinch=null}
  else if(ev.touches.length===2){
   var dx=ev.touches[0].clientX-ev.touches[1].clientX,dy=ev.touches[0].clientY-ev.touches[1].clientY;
   BGED.pinch={dist:Math.hypot(dx,dy)||1,zoom:BGED.zoom};BGED.drag=null;
  }
 },{passive:true});
 st.addEventListener('touchmove',function(ev){
  if(!BGED)return;ev.preventDefault();
  if(ev.touches.length===1&&BGED.drag){
   BGED.ox=BGED.drag.ox+(ev.touches[0].clientX-BGED.drag.x);
   BGED.oy=BGED.drag.oy+(ev.touches[0].clientY-BGED.drag.y);
   drawEd();
  }else if(ev.touches.length===2&&BGED.pinch){
   var dx=ev.touches[0].clientX-ev.touches[1].clientX,dy=ev.touches[0].clientY-ev.touches[1].clientY;
   BGED.zoom=Math.max(.5,Math.min(3,BGED.pinch.zoom*(Math.hypot(dx,dy)/BGED.pinch.dist)));
   var zm=$('ed-zm');if(zm)zm.value=Math.round(BGED.zoom*100);
   drawEd();
  }
 },{passive:false});
 st.addEventListener('mousedown',function(ev){if(BGED)BGED.drag={x:ev.clientX,y:ev.clientY,ox:BGED.ox,oy:BGED.oy}});
 st.addEventListener('mousemove',function(ev){if(!BGED||!BGED.drag)return;BGED.ox=BGED.drag.ox+(ev.clientX-BGED.drag.x);BGED.oy=BGED.drag.oy+(ev.clientY-BGED.drag.y);drawEd()});
 window.addEventListener('mouseup',function(){if(BGED)BGED.drag=null});
}
function closeBgEditor(){var o=$('bged');if(o)o.remove();BGED=null}
document.addEventListener('input',function(ev){
 if(!BGED)return;
 var id=ev.target.id,v=+ev.target.value;
 if(id==='ed-zm'){BGED.zoom=v/100;BGED.draw()}
 else if(id==='ed-br'){BGED.br=v;BGED.draw()}
 else if(id==='ed-ct'){BGED.ct=v;BGED.draw()}
 else if(id==='ed-sa'){BGED.sat=v;BGED.draw()}
 else if(id==='ed-bl'){BGED.blr=v;BGED.draw()}
 else if(id==='ed-dm'){BGED.dim=v;BGED.draw()}
});
document.addEventListener('click',function(ev){
 var b=ev.target.closest('[data-ed]');if(!b||!BGED)return;
 var a=b.dataset.ed;
 if(a==='rot'){BGED.rot=(BGED.rot+90)%360;BGED.draw()}
 else if(a==='rst'){
  BGED.rot=0;BGED.zoom=1;BGED.ox=0;BGED.oy=0;BGED.br=100;BGED.ct=100;BGED.sat=100;BGED.blr=0;BGED.dim=40;
  if($('ed-zm'))$('ed-zm').value=100;if($('ed-br'))$('ed-br').value=100;if($('ed-ct'))$('ed-ct').value=100;if($('ed-sa'))$('ed-sa').value=100;if($('ed-bl'))$('ed-bl').value=0;if($('ed-dm'))$('ed-dm').value=40;
  BGED.draw();
 }else if(a==='cancel'){
  closeBgEditor();
 }else if(a==='save'){
  var ok=true;
  try{
   var outScale=1000/Math.max(BGED.w,BGED.h);
   var outW=Math.max(1,Math.round(BGED.w*outScale)),outH=Math.max(1,Math.round(BGED.h*outScale));
   var ec=document.createElement('canvas');ec.width=outW;ec.height=outH;
   var ctx=ec.getContext('2d');
   ctx.filter='brightness('+BGED.br+'%) contrast('+BGED.ct+'%) saturate('+BGED.sat+'%)';
   var iw=(BGED.rot%180===0)?BGED.im.width:BGED.im.height;
   var ih=(BGED.rot%180===0)?BGED.im.height:BGED.im.width;
   var baseScale=Math.max(outW/iw,outH/ih);
   var sc=baseScale*BGED.zoom;
   ctx.translate(outW/2+BGED.ox*outScale,outH/2+BGED.oy*outScale);
   ctx.rotate(BGED.rot*Math.PI/180);
   ctx.scale(sc,sc);
   ctx.drawImage(BGED.im,-BGED.im.width/2,-BGED.im.height/2);
   S.bgi=ec.toDataURL('image/jpeg',.82);
   S.bg='custom';S.bb=BGED.blr;S.bd=BGED.dim;
   try{localStorage.setItem(K,JSON.stringify(S))}catch(_){ok=false}
   schedBk();closeBgEditor();draw(1);bmsg(ok?t('bgOk'):t('bgW'));
  }catch(_){closeBgEditor();bmsg(t('bgEr'))}
 }
});

window.imanOpenHome=function(){stopRing();tab='home';ST=null;show('app');draw()};
window.imanHandleBack=function(){
 if($('bged')){closeBgEditor();return'handled'}
 if($('permov')){closePermScreen(false);return'handled'}
 if($('sheet')&&$('sheet').innerHTML!==''){
  if(document.querySelector('.fsd')){$('sheet').innerHTML='';draw(1)}
  else{closeS()}
  return'handled';
 }
 if(tab==='set'&&ST!==null){ST=null;draw();return'handled'}
 if(tab!=='home'){tab='home';ST=null;draw();return'handled'}
 return'exit';
};
</script>
